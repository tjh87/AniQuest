<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AniQuest: source-linked Singapore wildlife lessons, quizzes, news and animal events." />
    <link rel="icon" type="image/png" href="/aniquest-logo.png" />
    <title>AniQuest — Singapore wildlife</title>
    <script>try{var t=localStorage.getItem('aniquest-theme');document.documentElement.classList.toggle('dark',t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches);var d=localStorage.getItem('aniquest-density');if(d!==null)document.documentElement.dataset.density=d;document.documentElement.dataset.uiStyle=localStorage.getItem('aniquest-ui-style')==='retro'?'retro':'classic'}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AniQuest needs JavaScript for lessons, quizzes and the events calendar.</noscript>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
