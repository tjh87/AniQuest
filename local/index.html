<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AniQuest: source-linked Singapore wildlife lessons, quizzes, news and animal events." />
    <link rel="icon" type="image/png" href="/aniquest-logo.png" />
    <title>AniQuest — Singapore wildlife</title>
    <script>try{var t=localStorage.getItem('aniquest-theme');document.documentElement.classList.toggle('dark',t==='dark');var d=localStorage.getItem('aniquest-density');if(d!==null)document.documentElement.dataset.density=d;var u=localStorage.getItem('aniquest-ui-style');document.documentElement.dataset.uiStyle=u==='retro'||u==='classic'?u:'cute';var p=localStorage.getItem('aniquest-pixel-palette');document.documentElement.dataset.pixelPalette=p==='forest'||p==='sunset'?p:'arcade'}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AniQuest needs JavaScript for lessons, quizzes and the events calendar.</noscript>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
